services:
  db-payment:
    image: postgres:15-alpine
    container_name: db-payment
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    networks:
      - microsservices-network

  payment-service:
    image: microsservices/payment-service:latest
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: payment-service
    ports:
      - "8082:8082"
    depends_on:
      db-payment:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db-payment:5432/payment_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - microsservices-network

networks:
  microsservices-network:
    external: true

volumes:
  payment_postgres_data: